<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Vung — Unity Game Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1c"/>
      <stop offset="0.55" stop-color="#151036"/>
      <stop offset="1" stop-color="#0a2430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .float{animation:float 5s ease-in-out infinite}
      .float2{animation:float 6.5s ease-in-out infinite reverse}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <circle cx="930" cy="150" r="230" fill="url(#glow)"/>

  <!-- Text block -->
  <g class="t">
    <text x="72" y="92" fill="#22b8cf" font-size="16" font-weight="600" letter-spacing="4">UNITY · C# · MOBILE GAMES</text>
    <text x="70" y="168" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-1">Vung</text>
    <text x="72" y="212" fill="#c9d1d9" font-size="26" font-weight="500">Unity Game Developer</text>
    <rect x="72" y="234" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="214" y="240" fill="#8b93a7" font-size="15">Gameplay systems · Game feel · Shipped on Google Play</text>
  </g>

  <!-- Game motif: puzzle board + phone -->
  <g transform="translate(820 52)">
    <g class="float">
      <rect x="0" y="0" width="128" height="200" rx="22" fill="#11162a" stroke="url(#accent)" stroke-width="2.5"/>
      <rect x="48" y="12" width="32" height="5" rx="2.5" fill="#2a3150"/>
      <!-- tiles -->
      <g transform="translate(18 34)">
        <rect x="0"  y="0"  width="26" height="26" rx="6" fill="#8b7cf6"/>
        <rect x="34" y="0"  width="26" height="26" rx="6" fill="#2a3150"/>
        <rect x="68" y="0"  width="26" height="26" rx="6" fill="#22b8cf"/>
        <rect x="0"  y="34" width="26" height="26" rx="6" fill="#2a3150"/>
        <rect x="34" y="34" width="26" height="26" rx="6" fill="#f472b6" class="pulse"/>
        <rect x="68" y="34" width="26" height="26" rx="6" fill="#2a3150"/>
        <rect x="0"  y="68" width="26" height="26" rx="6" fill="#22b8cf"/>
        <rect x="34" y="68" width="26" height="26" rx="6" fill="#2a3150"/>
        <rect x="68" y="68" width="26" height="26" rx="6" fill="#8b7cf6"/>
        <path d="M13 13 L47 47 L81 81" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 6"/>
      </g>
      <rect x="18" y="146" width="92" height="10" rx="5" fill="#2a3150"/>
      <rect x="18" y="146" width="62" height="10" rx="5" fill="url(#accent)"/>
      <circle cx="64" cy="178" r="9" fill="none" stroke="#2a3150" stroke-width="2.5"/>
    </g>

    <!-- floating code chip -->
    <g transform="translate(150 40)"><g class="float2 t">
      <rect width="196" height="74" rx="12" fill="#11162a" stroke="#2a3150"/>
      <circle cx="16" cy="16" r="4" fill="#f87171"/><circle cx="30" cy="16" r="4" fill="#fbbf24"/><circle cx="44" cy="16" r="4" fill="#34d399"/>
      <text x="16" y="42" font-family="Consolas,'Cascadia Code',monospace" font-size="13" fill="#8b7cf6">void <tspan fill="#22b8cf">OnTap</tspan><tspan fill="#c9d1d9">() {</tspan></text>
      <text x="28" y="60" font-family="Consolas,'Cascadia Code',monospace" font-size="13" fill="#c9d1d9">Juice();<tspan class="blink" fill="#22b8cf"> ▌</tspan></text>
    </g></g>

    <!-- sparkles -->
    <g fill="#22b8cf">
      <path class="pulse" d="M170 160 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/>
    </g>
    <g fill="#8b7cf6">
      <path class="pulse" style="animation-delay:1.2s" d="M300 150 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z"/>
    </g>
  </g>
</svg>
